<!DOCTYPE html>
<!--
  LETTERBEER — le carnet de canettes
  https://github.com/Levraiowen/Letterbeer

  Application web d'une seule page, sans étape de compilation : ce fichier
  se dépose tel quel sur un hébergeur statique. Les données vivent dans
  Supabase (PostgreSQL), interrogé directement depuis le navigateur avec
  la clé publique — la sécurité repose entièrement sur les règles RLS
  décrites dans sql/01-schema.sql, jamais sur le code de cette page.

  Organisation du fichier, dans l'ordre :

    <style>     variables de thème, puis composants du haut vers le bas
    <body>      la coque : en-tête, contenu, barre de navigation, feuilles
    <script>
      MARQUE et ICÔNES     SVG en ligne, aucune police d'icônes
      AUTHENTIFICATION     inscription, connexion, mot de passe oublié
      CHARGEMENT           hydrate() remplit le cache C en une passe
      ÉCHAPPEMENT          esc / safeColor / safeUrl — à utiliser sur
                           TOUTE donnée venant de la base ou d'un champ
      STORE                seul endroit qui parle à Supabase
      VUES                 fonctions v*() qui rendent une chaîne HTML
      FEUILLES             fonctions open*() / draw*() des panneaux
      DÉMARRAGE            hydrate puis render, ou écran de repli

  Deux règles à respecter si vous modifiez ce fichier :

    1. toute donnée affichée passe par esc(), safeColor() ou safeUrl() ;
       le rendu se fait par innerHTML, une omission ouvre une faille XSS
    2. toute écriture vérifie l'erreur renvoyée par Supabase avant de
       toucher au cache local, sinon l'écran affiche un succès que la
       base n'a pas enregistré
-->
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Letterbeer — le carnet de canettes</title>
<meta name="description" content="Le carnet de canettes : note tes bières, suis tes repères, partage avec tes potes.">
<meta name="theme-color" content="#0A0A0C">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0A0A0C; --surface:#141417; --surface-2:#1C1C20; --accent:#FF5A1F;
  --accent-soft:rgba(255,90,31,.14); --glow:rgba(255,90,31,.45);
  --text:#F4EFE8; --dim:#8D8D93; --dimmer:#5C5C63; --border:#232327;
  --ok:#3FD98B; --warn:#E8B04B; --bad:#FF4D4D;
  --e:cubic-bezier(.22,.8,.28,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#000;font-family:'Inter',system-ui,sans-serif;color:var(--text);
  display:flex;align-items:center;justify-content:center}
#phone{width:100%;max-width:430px;height:100dvh;max-height:920px;background:var(--bg);
  display:flex;flex-direction:column;position:relative;overflow:hidden}
@media(min-width:520px){#phone{border-radius:34px;border:1px solid #1c1c1f;
  box-shadow:0 40px 100px -30px rgba(255,90,31,.2)}}

/* Le bandeau flotte au-dessus du contenu, qui défile dessous et s'y
   efface. Le dégradé est calé en pixels depuis le bas, pour rester juste
   que l'écran ait des onglets ou non. */
#chrome{position:absolute;top:0;left:0;right:0;z-index:20;pointer-events:none;
  padding-bottom:22px;
  background:linear-gradient(to top,
    transparent 0,
    rgba(10,10,12,.35) 8px,
    rgba(10,10,12,.82) 15px,
    var(--bg) 22px)}
#chrome > *{pointer-events:auto}
#topbar{padding:16px 20px 10px;display:flex;align-items:center;justify-content:space-between;
  flex:0 0 auto;gap:8px;min-height:52px}
.lockup{display:flex;align-items:center;gap:9px;min-width:0}
button.lockup{background:none;border:0;padding:4px 6px;margin:-4px -6px;cursor:pointer;
  border-radius:10px;transition:.2s var(--e)}
button.lockup:active{transform:scale(.96)}
@media (hover:hover){
  button.lockup:hover{background:var(--surface)}
}
.lockup .lgmk{flex:0 0 auto;display:block}
.logo{font-family:'Space Grotesk';font-weight:700;font-size:19px;letter-spacing:2.2px;
  color:var(--text);white-space:nowrap}
.logo i{font-style:normal;color:var(--accent);text-shadow:0 0 18px var(--glow)}
.login-mark{display:flex;justify-content:center;padding:30px 0 4px}
.login-mark svg{filter:drop-shadow(0 10px 26px rgba(0,0,0,.6))}
/* La marque accompagne le titre au centre, plutôt que d'être reléguée
   dans un coin : les deux forment un bloc, comme sur l'accueil. */
.titlewrap{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:8px}
.titlemark{flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  background:none;border:0;padding:3px;margin:-3px;cursor:pointer;border-radius:50%;
  transition:transform .18s var(--e)}
.titlemark:active{transform:scale(.9)}
.screen-title{font-family:'Space Grotesk';font-weight:600;font-size:18px;letter-spacing:-.01em;
  flex:0 1 auto;min-width:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.screen-title i{font-style:normal;color:var(--accent)}
.screen-title .pt{margin-left:1px}
@media (hover:hover){.titlemark:hover{background:var(--surface-2)}}
.icon-btn{background:none;border:0;color:var(--dim);display:flex;padding:6px;cursor:pointer;
  border-radius:50%;transition:color .18s,background .18s,transform .12s;flex:0 0 auto}
.icon-btn:hover{color:var(--text);background:var(--surface-2)}
.icon-btn:active{transform:scale(.9);color:var(--accent)}

/* plus de filet sous les onglets : c'est le dégradé qui sépare désormais */
#tabs{flex:0 0 auto;padding-top:6px}
.tabwrap{position:relative;display:flex;justify-content:center;gap:30px}
.tab{background:none;border:0;font-family:'Inter';font-size:14px;font-weight:500;color:var(--dim);
  padding:0 4px 12px;cursor:pointer;transition:color .22s,transform .14s}
.tab:hover{color:var(--text)}
.tab:active{transform:scale(.94)}
.tab.on{color:var(--accent);font-weight:600}
#ind{position:absolute;bottom:-1px;height:2px;background:var(--accent);border-radius:2px;
  box-shadow:0 0 10px var(--glow);transition:left .34s var(--e),width .34s var(--e);left:0;width:0}

/* overflow-x explicite : sans lui, overflow-y:auto rend l'axe horizontal
   « auto » à son tour, et le moindre débordement d'un pixel laisse la page
   glisser latéralement. Les carrousels ont leur propre conteneur défilant. */
#view{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
  padding-bottom:26px;position:relative}
#view::-webkit-scrollbar{width:0}
.page.slide{animation:sl .3s var(--e)}
@keyframes sl{from{opacity:0;transform:translateX(calc(var(--d,1) * 26px))}to{opacity:1;transform:none}}

#bottombar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-around;
  padding:12px 12px calc(12px + env(safe-area-inset-bottom));background:#0E0E10;border-top:1px solid var(--border)}
.nav{background:none;border:0;color:var(--dimmer);display:flex;padding:8px;cursor:pointer;
  border-radius:14px;transition:color .2s,background .2s,transform .16s}
.nav:hover{color:var(--dim);background:var(--surface)}
.nav:active{transform:scale(.86)}
.nav.on{color:var(--accent);filter:drop-shadow(0 0 8px var(--glow))}
.nav.on svg{animation:pop .34s var(--e)}
@keyframes pop{0%{transform:scale(.8)}55%{transform:scale(1.14)}100%{transform:scale(1)}}
.add{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#0A0A0C;
  display:flex;align-items:center;justify-content:center;border:0;cursor:pointer;
  box-shadow:0 0 20px var(--glow);transition:transform .16s var(--e),box-shadow .2s}
.add:hover{transform:scale(1.08) rotate(90deg);box-shadow:0 0 32px var(--glow)}
.add:active{transform:scale(.9)}

.sec{padding:20px 20px 4px;display:flex;align-items:baseline;justify-content:space-between}
.sec h2{font-family:'Space Grotesk';font-size:15px;font-weight:600;letter-spacing:.2px}
.eyebrow{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dimmer);font-weight:500}
/* minmax(0,1fr) et non 1fr : sinon une piste refuse de descendre sous la
   largeur mini de son contenu, et un nom de bière un peu long élargit la
   colonne jusqu'à faire déborder la grille. */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;padding:10px 20px 6px}
.rail{display:flex;gap:13px;padding:10px 20px 6px;overflow-x:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .cell{flex:0 0 96px}
.cell{background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;gap:6px}

.can{width:100%;aspect-ratio:2/3;border-radius:12px;background:var(--surface-2);
  border:1px solid var(--border);overflow:hidden;display:flex;flex-direction:column;position:relative;
  transition:transform .26s var(--e),box-shadow .26s,border-color .26s}
.can::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.11),transparent 44%);
  opacity:0;transition:opacity .3s}
/* Sur un écran tactile, :hover reste collé sur le dernier élément touché :
   la carte tapée resterait agrandie et surélevée, comme si elle buguait.
   On réserve donc l'effet aux appareils qui survolent vraiment. */
@media (hover:hover){
  .cell:hover .can{transform:translateY(-6px) scale(1.035);border-color:#3a3a41;
    box-shadow:0 14px 26px -12px rgba(0,0,0,.9),0 0 22px -6px var(--glow)}
  .cell:hover .can::after{opacity:1}
  .cell:hover .stars{color:var(--accent)}
  .cell:hover .pull{background:var(--accent)}
}
.cell:active .can{transform:translateY(-2px) scale(.99)}
.can .rim{height:15%;background:#2C2C31;border-bottom:1px solid #0f0f11;display:flex;align-items:center;justify-content:center}
.can .pull{width:15px;height:6px;border-radius:5px;background:#45454c;transition:background .3s}
.can .body{flex:1;display:flex;flex-direction:column;justify-content:flex-end}
.can .band{padding:7px 7px 8px}
.can .bname{font-family:'Space Grotesk';font-weight:600;font-size:10.5px;line-height:1.2;color:#1a0800}
.can .bstyle{font-size:8px;line-height:1.3;margin-top:2px;color:rgba(26,8,0,.62);font-weight:500}
/* le degré vit dans le bandeau, aligné au nom — rien ne flotte sur la photo */
.can .brow{display:flex;align-items:flex-end;justify-content:space-between;gap:5px}
.can .btxt{display:block;min-width:0;flex:1}
.can .bname,.can .bstyle{display:block}
.can .abv{font-size:9px;font-weight:700;white-space:nowrap;padding-bottom:1px;color:rgba(26,8,0,.6)}
.can .pend{position:absolute;top:19%;left:5px;font-size:7.5px;font-weight:600;letter-spacing:.4px;
  color:#1a0800;background:var(--warn);padding:1px 5px;border-radius:7px;z-index:2}
.cell .meta{display:flex;align-items:center;justify-content:center;gap:5px}
.stars{font-size:10.5px;letter-spacing:.5px;color:var(--accent);white-space:nowrap;transition:color .25s}
.stars.dim{color:var(--dimmer)}

/* avis */
.review{padding:16px 20px;border-bottom:1px solid var(--border);transition:background .25s,opacity .3s}
.review:hover{background:#0F0F12}
.review.muted{opacity:.42}
.rev-head{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:600;color:#12060099;flex:0 0 auto;background-size:cover;background-position:center;
  border:0;cursor:pointer;font-family:'Inter';transition:transform .2s var(--e),box-shadow .2s}
.av:hover{transform:scale(1.14);box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--accent)}
.uname{font-size:13px;font-weight:500;background:none;border:0;color:var(--text);cursor:pointer;
  font-family:'Inter';padding:0;transition:color .2s}
.uname:hover{color:var(--accent)}
.rev-sub{font-size:11px;color:var(--dimmer)}
.rev-body{display:flex;gap:12px}
.rev-can{width:52px;flex:0 0 52px}
.rev-text{font-size:13.5px;line-height:1.55;color:#D5D0CA}
.rev-beer{font-family:'Space Grotesk';font-size:13px;font-weight:600;margin-bottom:3px}
.acts{display:flex;align-items:center;gap:8px;margin-top:11px;padding-left:64px}
.act{background:none;border:0;color:var(--dimmer);font-size:12px;font-weight:500;display:flex;
  align-items:center;gap:6px;cursor:pointer;font-family:'Inter';padding:6px 11px;border-radius:16px;
  transition:color .2s,background .2s,transform .14s}
.act:hover{color:var(--text);background:var(--surface-2)}
.act:active{transform:scale(.9)}
.act.on{color:var(--accent);background:var(--accent-soft)}
.act.on svg{animation:cheers .42s var(--e)}
@keyframes cheers{0%{transform:rotate(0) scale(1)}30%{transform:rotate(-12deg) scale(1.16)}
  60%{transform:rotate(9deg) scale(1.1)}100%{transform:rotate(0) scale(1)}}
.act.bof{margin-left:auto;padding:6px 9px}
.act.bof.on{color:var(--warn);background:rgba(232,176,75,.13)}
.privcount{font-size:10.5px;color:var(--dimmer);padding:7px 0 0 64px;display:flex;align-items:center;gap:6px}
/* --- répondre à un avis --- */
.rep-src{display:flex;gap:12px;align-items:flex-start;margin:16px 20px 0;padding:13px 15px;
  background:var(--surface);border:1px solid var(--border);border-radius:13px}
.rep-srct{flex:1;min-width:0}
.rep-srct b{font-size:13px;font-weight:600;color:var(--text)}
.rep-srct span{font-size:11.5px;color:var(--dimmer);margin-left:7px}
.rep-srcq{font-size:12.5px;line-height:1.55;color:var(--dim);margin-top:6px;
  border-left:2px solid var(--border);padding-left:10px}
.rep-compte{text-align:right;font-size:11px;color:var(--dimmer);margin:6px 20px 0;
  font-variant-numeric:tabular-nums}
.replies{padding:8px 0 0 64px;display:flex;flex-direction:column;gap:8px}
.reply{font-size:12.5px;line-height:1.5;color:var(--dim);border-left:2px solid var(--border);padding-left:10px;
  transition:border-color .25s}
.reply:hover{border-left-color:var(--accent)}
.reply b{color:var(--text);font-weight:500}

.art{margin:12px 20px;border-radius:14px;overflow:hidden;background:var(--surface);border:1px solid var(--border);
  cursor:pointer;transition:transform .25s var(--e),border-color .25s,box-shadow .25s}
.art:hover{transform:translateY(-4px);border-color:#33333a;box-shadow:0 16px 30px -18px #000}
.art .ph{min-height:96px;display:flex;flex-direction:column;align-items:flex-start;
  justify-content:center;gap:4px;padding:16px 15px;border-bottom:1px solid var(--border)}
.art .stat{font-family:'Space Grotesk';font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1}
.art .statlbl{font-size:11px;line-height:1.4;color:var(--dim);max-width:90%}
.art .cap{padding:13px 15px 15px}
.art .artmeta{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--dimmer);margin-bottom:6px}
.art .artmeta b{font-weight:600}
.art h3{font-family:'Space Grotesk';font-size:14.5px;font-weight:600;margin-bottom:5px}
.art p{font-size:12.5px;line-height:1.5;color:var(--dim)}
.art .artlink{margin-top:11px;font-size:11.5px;font-weight:500;color:var(--accent);
  display:flex;align-items:center;gap:5px}
.art:hover .artlink{text-decoration:underline;text-underline-offset:2px}

.row{display:flex;align-items:center;gap:13px;padding:13px 20px;border:0;border-bottom:1px solid var(--border);
  background:none;width:100%;text-align:left;cursor:default;color:var(--text);position:relative;
  transition:background .22s,padding-left .22s var(--e)}
.row::before{content:'';position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent);
  transition:width .22s var(--e);box-shadow:0 0 12px var(--glow)}
.row.tap{cursor:pointer}
.row.tap:hover{background:#0F0F12;padding-left:26px}
.row.tap:hover::before{width:3px}
.row .n{font-family:'Space Grotesk';font-size:13px;color:var(--dimmer);width:18px;flex:0 0 18px}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{font-size:11.5px;color:var(--dim)}
.chev{color:var(--dimmer);transition:transform .22s var(--e),color .22s}
.row.tap:hover .chev{transform:translateX(4px);color:var(--accent)}

.chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 20px 4px}
.chip{background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-size:12.5px;
  font-weight:500;padding:8px 13px;border-radius:20px;cursor:pointer;font-family:'Inter';
  transition:background .2s,border-color .2s,color .2s,transform .14s}
.chip:hover{border-color:#3a3a41;transform:translateY(-2px)}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);box-shadow:0 0 16px -6px var(--glow)}
.searchbar{margin:14px 20px 2px;display:flex;align-items:center;gap:10px;background:var(--surface-2);
  border:1px solid var(--border);border-radius:22px;padding:11px 15px;transition:border-color .22s,box-shadow .22s}
.searchbar:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.searchbar input{flex:1;background:none;border:0;outline:0;color:var(--text);font-size:14px;font-family:'Inter'}
.searchbar input::placeholder{color:var(--dimmer)}

.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;padding:14px 20px 4px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:13px 14px;
  transition:transform .24s var(--e),border-color .24s}
.stat:hover{transform:translateY(-3px);border-color:#33333a}
.stat .k{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--dimmer);font-weight:500}
.stat .v{font-family:'Space Grotesk';font-size:22px;font-weight:600;margin-top:5px}
.stat .v small{font-size:12px;color:var(--dim);font-weight:500}
.histo{display:flex;align-items:flex-end;gap:5px;height:76px;padding:16px 20px 0}
.histo .bar{flex:1;background:var(--surface-2);border-radius:3px 3px 0 0;min-height:3px;
  transform-origin:bottom;animation:grow .5s var(--e) both;transition:background .2s}
.histo .bar:hover{background:#3a3a41}
.histo .bar.hi{background:var(--accent);box-shadow:0 0 12px var(--glow)}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.histo-ax{display:flex;justify-content:space-between;padding:7px 20px 0;font-size:11px;color:var(--dimmer)}
.barlist{padding:12px 20px 4px;display:flex;flex-direction:column;gap:11px}
.bl-row{display:flex;align-items:center;gap:11px;font-size:12.5px}
.bl-row .lbl{width:96px;flex:0 0 96px;color:var(--dim)}
.bl-track{flex:1;height:7px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bl-fill{height:100%;background:var(--accent);border-radius:4px;transform-origin:left;animation:growx .6s var(--e) both}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bl-row .num{font-size:11.5px;color:var(--dimmer);width:26px;text-align:right}

.counter{margin:16px 20px 0;background:linear-gradient(150deg,#1A1013,var(--surface));
  border:1px solid #2c1d18;border-radius:18px;padding:18px;display:flex;align-items:center;gap:16px}
.counter .big-n{font-family:'Space Grotesk';font-size:42px;font-weight:700;line-height:1;
  color:var(--accent);text-shadow:0 0 26px var(--glow);min-width:56px}
.counter .big-n.bump{animation:bump .42s var(--e)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
.counter .lbl{flex:1}
.counter .lbl b{display:block;font-size:13px;font-weight:500}
.counter .lbl span{font-size:11.5px;color:var(--dim);line-height:1.5}
.cbtn{width:46px;height:46px;border-radius:50%;border:1px solid var(--accent);background:var(--accent-soft);
  color:var(--accent);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:transform .18s var(--e),background .2s,box-shadow .2s}
.cbtn:hover{background:var(--accent);color:#0A0A0C;box-shadow:0 0 26px var(--glow);transform:scale(1.08)}
.cbtn:active{transform:scale(.9)}

.repere{margin:14px 20px 0;background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.rp-row{display:flex;align-items:center;justify-content:space-between;padding:12px 15px;border-bottom:1px solid var(--border)}
.rp-row:last-child{border-bottom:0}
.rp-row .k{font-size:12.5px;color:var(--dim)}
.rp-row .v{font-family:'Space Grotesk';font-size:14px;font-weight:600}
.rp-row .v small{font-size:11px;color:var(--dimmer);font-weight:400;font-family:'Inter'}
.note{display:flex;align-items:flex-start;gap:9px;margin:12px 20px 0;padding:12px 14px;border-radius:12px;
  background:var(--surface);border:1px solid var(--border);font-size:12px;color:var(--dim);line-height:1.55}
.note.warn{border-color:#3a2e18;background:#17130C;color:#D8C69C}
.note svg{flex:0 0 auto;margin-top:1px}

.phead{display:flex;flex-direction:column;align-items:center;padding:22px 20px 6px;gap:9px}
.pic{width:82px;height:82px;border-radius:50%;background:var(--accent);color:#1a0800;border:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';position:relative;
  font-size:28px;font-weight:700;box-shadow:0 0 26px var(--glow);background-size:cover;background-position:center;
  transition:transform .24s var(--e),box-shadow .24s}
.pic:hover{transform:scale(1.05);box-shadow:0 0 40px var(--glow)}
.pic:active{transform:scale(.97)}
.pic .badge{position:absolute;right:-2px;bottom:-2px;width:27px;height:27px;border-radius:50%;
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);display:flex;align-items:center;justify-content:center}
.phead .h{font-family:'Space Grotesk';font-size:17px;font-weight:600}
.phead .s{font-size:12px;color:var(--dim)}
.follrow{display:flex;gap:20px;margin-top:4px}
.follrow button,.follrow div{background:none;border:0;color:var(--text);cursor:pointer;text-align:center;
  font-family:'Inter';padding:6px 10px;border-radius:10px;transition:background .2s,transform .14s}
.follrow button:hover{background:var(--surface)}
.follrow button:active{transform:scale(.94)}
.follrow b{display:block;font-family:'Space Grotesk';font-size:16px;font-weight:600}
.follrow span{font-size:11px;color:var(--dim)}
.follow{background:var(--accent-soft);border:1px solid var(--accent);color:var(--accent);
  font-size:12px;font-weight:600;padding:7px 16px;border-radius:18px;cursor:pointer;font-family:'Inter';
  transition:transform .16s var(--e),background .2s,color .2s}
.follow:hover{background:var(--accent);color:#0A0A0C}
.follow:active{transform:scale(.92)}
.follow.on{background:none;border-color:var(--border);color:var(--dim)}
.follow.on:hover{border-color:var(--bad);color:var(--bad);background:none}
.follow.lg{padding:10px 30px;font-size:13px;border-radius:22px}

.sw{width:44px;height:25px;border-radius:14px;background:var(--surface-2);border:1px solid var(--border);
  position:relative;cursor:pointer;flex:0 0 auto;transition:background .26s,border-color .26s}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;
  background:var(--dimmer);transition:transform .26s var(--e),background .26s}
.sw.on{background:var(--accent-soft);border-color:var(--accent)}
.sw.on::after{transform:translateX(19px);background:var(--accent);box-shadow:0 0 12px var(--glow)}
.lockrow{display:flex;align-items:center;gap:13px;padding:13px 20px;border-bottom:1px solid var(--border)}
.lockrow .t{flex:1}
.locked{margin:14px 20px 0;padding:30px 20px;border:1px dashed var(--border);border-radius:14px;text-align:center;
  color:var(--dimmer);font-size:13px;line-height:1.6}
.locked svg{margin-bottom:9px}

#sheet{position:absolute;inset:0;background:rgba(0,0,0,.66);backdrop-filter:blur(4px);
  display:none;align-items:flex-end;z-index:20;animation:bg .22s ease}
@keyframes bg{from{opacity:0}to{opacity:1}}
#sheet.open{display:flex}
.sheet-in{background:var(--bg);width:100%;max-height:92%;border-radius:22px 22px 0 0;
  border-top:1px solid var(--border);display:flex;flex-direction:column;animation:up .3s var(--e)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px;
  border-bottom:1px solid var(--border);flex:0 0 auto}
.sheet-bar b{font-family:'Space Grotesk';font-size:15px;font-weight:600}
.grab{width:38px;height:4px;border-radius:3px;background:var(--border);margin:9px auto 0;
  transition:background .2s}
/* pendant le glissé, la feuille suit le doigt : pas de transition, sinon
   elle traîne derrière lui */
.sheet-in.drag{animation:none;transition:none;will-change:transform}
.sheet-in.drag .grab{background:var(--dim)}
.sheet-in.snap{animation:none;transition:transform .26s var(--e)}
.sheet-body{overflow-y:auto;padding-bottom:22px;overscroll-behavior:contain}
.sheet-body::-webkit-scrollbar{width:0}
.beer-hero{display:flex;gap:15px;padding:18px 20px 4px}
.beer-hero .can{width:84px;flex:0 0 84px}
.beer-hero h1{font-family:'Space Grotesk';font-size:19px;font-weight:600;line-height:1.15}
.beer-hero .br{font-size:13px;color:var(--accent);margin-top:3px}
.beer-hero .fx{font-size:12px;color:var(--dim);margin-top:7px;line-height:1.6}
.avgbox{display:flex;align-items:center;gap:11px;margin-top:11px}
.avgbox .num{font-family:'Space Grotesk';font-size:26px;font-weight:600}
.desc{padding:14px 20px 0;font-size:13.5px;line-height:1.6;color:#CFCAC4}
.rate-zone{margin:16px 20px 0;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:15px}
.rate-stars{display:flex;gap:9px;justify-content:center;margin:4px 0 2px}
.hint{text-align:center;font-size:11px;color:var(--dimmer);margin-top:7px;line-height:1.5}
textarea,input.f,select.f{width:100%;background:var(--surface-2);border:1px solid var(--border);
  border-radius:11px;color:var(--text);font-family:'Inter';font-size:13.5px;padding:11px 13px;outline:0;resize:none;
  transition:border-color .2s,box-shadow .2s}
textarea:focus,input.f:focus,select.f:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field{padding:13px 20px 0}
.field label{display:block;font-size:11px;letter-spacing:1px;text-transform:uppercase;
  color:var(--dimmer);font-weight:500;margin-bottom:7px}
.two{display:flex;gap:11px}
.two>div{flex:1}
.cta{margin:18px 20px 0;width:calc(100% - 40px);background:var(--accent);color:#0A0A0C;border:0;
  border-radius:13px;padding:14px;font-family:'Space Grotesk';font-size:15px;font-weight:600;
  cursor:pointer;box-shadow:0 0 22px var(--glow);transition:transform .16s var(--e),box-shadow .2s}
.cta:hover{transform:translateY(-2px);box-shadow:0 6px 34px var(--glow)}
.cta:active{transform:scale(.98)}
.cta.danger{background:var(--bad);color:#fff}
.cta.danger:hover{box-shadow:0 6px 34px rgba(255,77,77,.4)}
.cta:disabled{opacity:.38;pointer-events:none}
.ghost{margin:10px 20px 0;width:calc(100% - 40px);background:none;color:var(--dim);
  border:1px solid var(--border);border-radius:13px;padding:12px;font-family:'Inter';font-size:13px;cursor:pointer;
  transition:border-color .2s,color .2s,background .2s}
.ghost:hover{border-color:#3a3a41;color:var(--text);background:var(--surface)}
.pricebox{margin:14px 20px 0;border:1px solid var(--border);border-radius:14px;overflow:hidden}
.price-r{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;
  border-bottom:1px solid var(--border);font-size:13px;transition:background .2s}
.price-r:hover{background:var(--surface)}
.price-r:last-child{border-bottom:0}
.price-r.best{background:rgba(255,90,31,.07)}
.price-r.old{opacity:.62}
.price-r .shop{min-width:0;flex:1}
.price-r .shop b{display:block;font-weight:500}
.price-r .shop span{font-size:11px;color:var(--dimmer)}
.price-r .p{font-family:'Space Grotesk';font-weight:600;color:var(--accent);flex:0 0 auto}
.tagbest{font-size:9px;letter-spacing:.8px;text-transform:uppercase;color:#1a0800;background:var(--accent);
  padding:2px 7px;border-radius:9px;margin-left:7px;font-weight:600}
.tagold{font-size:9px;letter-spacing:.8px;text-transform:uppercase;color:#1a0800;background:var(--warn);
  padding:2px 7px;border-radius:9px;margin-left:7px;font-weight:600}
.confirm{background:none;border:1px solid var(--border);color:var(--dim);font-size:11px;padding:5px 10px;
  border-radius:14px;cursor:pointer;font-family:'Inter';transition:border-color .2s,color .2s}
.confirm:hover{border-color:var(--accent);color:var(--accent)}
.tagline{display:flex;flex-wrap:wrap;gap:7px;padding:12px 20px 0}
.tg{font-size:11.5px;color:var(--dim);background:var(--surface-2);padding:5px 11px;border-radius:14px}
.empty{padding:46px 34px;text-align:center;color:var(--dimmer);font-size:13.5px;line-height:1.6}
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(14px);
  background:var(--accent);color:#0A0A0C;font-size:13px;font-weight:600;padding:11px 20px;
  border-radius:22px;opacity:0;transition:.28s var(--e);pointer-events:none;z-index:30;max-width:80%;
  text-align:center;box-shadow:0 8px 30px -6px var(--glow)}
.toast.show{opacity:1;transform:translateX(-50%)}
.divider{height:1px;background:var(--border);margin:18px 20px 0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* vignette de liste : pas de bandeau, photo un peu plus serrée puisqu'il
   n'y a plus de texte à laisser respirer en bas */
/* vignette de ligne : display:block indispensable, une largeur ne
   s'applique pas à un span resté en display:inline */
.vign{flex:0 0 32px;width:32px;display:block}
.can.mini{aspect-ratio:2/3;border-radius:7px}
.can.mini .ph-fg{padding:8% 8%;background-position:center}
.can.mini .rim{height:20%}
.can.mini .pull{width:9px;height:4px}
.can .ph{position:absolute;inset:0;background:#0E0E11;overflow:hidden}
/* fond : la photo agrandie et floutée, pour qu'aucune bande vide n'apparaisse */
.can .ph-bg{position:absolute;inset:-12%;background-size:cover;background-position:center;
  filter:blur(15px) saturate(1.35) brightness(.5);transform:scale(1.08)}
/* premier plan : la photo entière, jamais rognée, donc un cadrage
   identique d'une bière à l'autre quel que soit le format d'origine */
.can .ph-fg{position:absolute;inset:0;background-size:contain;background-repeat:no-repeat;
  background-position:center 42%;padding:6% 8% 22%;background-origin:content-box}
.can.hasph .ph::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to bottom,rgba(14,14,17,.45),transparent 30%)}
.can.hasph .band{background:linear-gradient(to top,rgba(0,0,0,.94),rgba(0,0,0,.6) 72%,transparent)!important;
  position:relative;z-index:2}
.can.hasph .bname{color:#F4EFE8}
.can.hasph .bstyle{color:rgba(244,239,232,.62)}
.can .bname{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.can .bstyle{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.can.hasph .abv{color:#FF8A4D}
.grid{align-items:start}
.cell .meta{min-height:16px}
/* --- étoiles fractionnaires --- */
.stars .st{position:relative;display:inline-block;color:rgba(244,239,232,.17)}
.stars .stf{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;
  color:var(--accent);transition:width .18s var(--e)}
.stars.dim .stf{color:var(--dimmer)}
@media (hover:hover){.cell:hover .stars .stf{color:var(--accent)}}
/* --- saisie de la note, demi-étoile au tap --- */
.rsw{position:relative;display:inline-block;font-size:30px;line-height:1}
.rss{position:relative;display:block;color:var(--dimmer)}
.rsf{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;color:var(--accent);
  text-shadow:0 0 14px var(--glow);transition:width .16s var(--e)}
.rsf.pre{opacity:.5;text-shadow:none}
.rsh{position:absolute;top:0;bottom:0;left:0;width:50%;background:none;border:0;padding:0;
  cursor:pointer;z-index:2;-webkit-tap-highlight-color:transparent}
.rsh.rsr{left:50%}
.rate-val{text-align:center;font-size:12px;color:var(--dim);margin-top:2px;min-height:15px}
.rate-val b{color:var(--accent);font-weight:600}
/* --- photo agrandie --- */
.beer-hero .zoomable{width:84px;flex:0 0 84px;padding:0;border:0;background:none;
  display:block;position:relative;cursor:zoom-in}
.beer-hero .zoomable .can{width:100%}
.zoomcue{position:absolute;right:5px;bottom:5px;z-index:3;display:flex;align-items:center;
  justify-content:center;width:21px;height:21px;border-radius:50%;color:#F4EFE8;
  background:rgba(10,10,12,.62);border:.5px solid rgba(255,255,255,.2);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:.22s var(--e)}
.beer-hero .zoomable:hover .zoomcue{background:var(--accent);color:#0A0A0C;transform:scale(1.1)}
.lightbox{position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  padding:26px;cursor:zoom-out;background:rgba(6,6,8,.93);backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);opacity:0;transition:opacity .22s var(--e)}
.lightbox.in{opacity:1}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:14px;
  transform:scale(.93);transition:transform .28s var(--e);box-shadow:0 24px 60px -18px rgba(0,0,0,.9)}
.lightbox.in img{transform:scale(1)}
.lb-x{position:absolute;top:15px;right:15px;width:34px;height:34px;border-radius:50%;border:0;
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:#F4EFE8;
  background:rgba(255,255,255,.12)}
/* --- écran à propos --- */
.ab-sec{display:flex;align-items:center;gap:9px;margin:30px 20px 4px;
  padding-bottom:10px;border-bottom:1px solid var(--border);color:var(--accent)}
.ab-sec h2{font-family:'Space Grotesk';font-size:16px;font-weight:600;color:var(--text);letter-spacing:-.01em}
.ab-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin:14px 20px 0}
.ab-colhead{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  font-weight:600;margin-bottom:9px}
.ab-colhead.ok{color:var(--ok)}
.ab-colhead.no{color:var(--dimmer)}
.ab-split .ab-li{font-size:12px;padding-left:19px;line-height:1.45}
.ab-split .ab-li::before{font-size:11px}
.ab-split .ab-li.ok::before{color:var(--ok)}
.ab-facts{margin:20px 20px 0;border:1px solid var(--border);border-radius:13px;overflow:hidden}
.ab-fact{display:flex;gap:14px;padding:12px 15px;border-bottom:1px solid var(--border)}
.ab-fact:last-child{border-bottom:0}
.ab-fk{flex:0 0 84px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--dimmer);padding-top:2px}
.ab-fv{flex:1;font-size:12.5px;line-height:1.5;color:var(--text)}
.ab-fv b{color:var(--accent);font-weight:600}
.ab-help{display:block;margin:14px 20px 0;padding:15px 16px;border-radius:13px;text-decoration:none;
  background:rgba(255,90,31,.07);border:1px solid rgba(255,90,31,.3);transition:.2s var(--e)}
.ab-help:active{transform:scale(.99)}
.ab-hk{display:block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--dimmer)}
.ab-hn{display:block;font-family:'Space Grotesk';font-size:22px;font-weight:700;
  color:var(--accent);letter-spacing:.01em;margin:5px 0 3px}
.ab-hs{display:block;font-size:11.5px;color:var(--dim)}
.danger{margin:26px 20px 0;padding:16px;border:1px solid #3a1f1f;border-radius:13px;
  background:rgba(255,77,77,.04)}
.danger-h{font-family:'Space Grotesk';font-size:14px;font-weight:600;color:var(--bad);margin-bottom:6px}
.danger-p{font-size:12px;line-height:1.5;color:var(--dim);margin-bottom:13px}
.danger-btn{width:100%;background:none;border:1px solid #3a1f1f;color:var(--bad);
  border-radius:12px;padding:11px;font-family:inherit;font-size:13px;font-weight:600;
  cursor:pointer;transition:.2s var(--e)}
.danger-btn:hover{background:rgba(255,77,77,.1)}
.ab-hero{text-align:center;padding:20px 0 6px;display:flex;flex-direction:column;align-items:center;gap:12px}
.ab-word{font-family:'Space Grotesk';font-size:21px;font-weight:700;letter-spacing:.13em;color:var(--text)}
.ab-word span{color:var(--accent)}
.ab-ver{font-size:11.5px;color:var(--dimmer);margin-top:-6px;letter-spacing:.03em}
.ab-list{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:9px}
.ab-li{position:relative;padding-left:25px;font-size:13px;line-height:1.5;color:var(--dim)}
.ab-li::before{position:absolute;left:0;top:0;font-size:13px;font-weight:700}
.ab-li.ok::before{content:'✓';color:var(--accent)}
.ab-li.no::before{content:'✕';color:var(--dimmer)}
.ab-card{background:var(--surface-2);border:1px solid var(--border);border-radius:13px;
  padding:13px 15px;margin:11px 20px 0}
.ab-card.accent{border-color:rgba(255,90,31,.35)}
.ab-k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--dimmer);margin-bottom:5px}
.ab-v{font-size:13px;line-height:1.55;color:var(--text)}
.ab-v b{color:var(--accent);font-weight:600}
.ab-p{font-size:13px;line-height:1.6;color:var(--dim);margin:10px 20px 0}
.ab-card .ab-p{margin-left:0;margin-right:0}
.ab-p b{color:var(--text);font-weight:600}
.ab-p.dim{font-size:12px;color:var(--dimmer)}
.ab-foot{margin:26px 20px 0;padding-top:16px;border-top:1px solid var(--border);
  font-size:11.5px;line-height:1.7;color:var(--dimmer);text-align:center}
.est{font-size:10px;color:var(--dimmer);border:1px solid var(--border);border-radius:6px;
  padding:0 4px;margin-left:3px;letter-spacing:.02em;cursor:help}
/* --- bandeau « déjà notée » + bouton +1 --- */
.already{display:flex;align-items:flex-start;gap:10px;margin:14px 20px 0;padding:12px 14px;
  background:rgba(255,90,31,.08);border:1px solid rgba(255,90,31,.28);border-radius:12px;
  font-size:12.5px;line-height:1.5;color:var(--dim)}
.already svg{flex:0 0 auto;color:var(--accent);margin-top:1px}
.already b{color:var(--text);font-weight:600}
.plus1{flex:0 0 auto;align-self:center;background:var(--accent);color:#0A0A0C;border:0;
  font-family:'Space Grotesk';font-weight:700;font-size:14px;padding:7px 14px;border-radius:20px;
  cursor:pointer;transition:.2s var(--e)}
.plus1:hover{transform:scale(1.06);box-shadow:0 4px 18px var(--glow)}
.plus1:active{transform:scale(.97)}
/* bandeau hors ligne */
.offline{position:absolute;left:0;right:0;bottom:0;z-index:40;padding:9px 20px;
  background:var(--warn);color:#1a1206;font-size:12px;font-weight:600;text-align:center;
  transform:translateY(100%);transition:transform .28s var(--e);pointer-events:none}
.offline.show{transform:translateY(0)}
/* mention sanitaire — obligatoire en France sur la promotion d'alcool */
.evin{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dimmer);
  text-align:center;line-height:1.5;padding:18px 24px 4px}
.evin.strong{color:var(--dim);border-top:1px solid var(--border);margin-top:10px;padding-top:16px}
/* champ mot de passe avec bouton œil */
.pwwrap{position:relative;display:block}
.pwwrap .f{width:100%;padding-right:46px}
.pweye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;
  display:flex;align-items:center;justify-content:center;background:none;border:0;
  color:var(--dimmer);cursor:pointer;border-radius:9px;transition:color .2s}
.pweye:hover{color:var(--accent)}
.linkbtn{display:block;margin:14px auto 0;background:none;border:0;cursor:pointer;
  font-size:12.5px;color:var(--dim);text-decoration:underline;text-underline-offset:3px;
  font-family:inherit;padding:6px}
.linkbtn:hover{color:var(--accent)}
/* --- modération : la photo décide, donc elle domine la carte --- */
.modgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:12px;padding:14px 20px 0}
.modcard{background:var(--surface);border:1px solid var(--border);border-radius:13px;
  overflow:hidden;display:flex;flex-direction:column}
.modph{width:100%;aspect-ratio:1/1;background:#0E0E11;border:0;padding:0;display:block;
  cursor:zoom-in;position:relative}
.modph img{width:100%;height:100%;object-fit:contain;display:block}
.modph.vide{display:flex;align-items:center;justify-content:center;font-size:11px;
  color:var(--dimmer);cursor:default}
.modinfo{padding:10px 12px 8px;min-width:0}
.modinfo b{display:block;font-size:12.5px;font-weight:600;color:var(--text);line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.modinfo span{display:block;font-size:11px;color:var(--dim);margin-top:3px}
.modacts{display:flex;gap:6px;padding:0 12px 12px;margin-top:auto}

const SUPABASE_URL = 'https://wleilfzebdkudkteezht.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndsZWlsZnplYmRrdWRrdGVlemh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0ODg4NjgsImV4cCI6MjEwMzA2NDg2OH0.unusUeG7zH_eebyi7TccxoXJ9D_Shp2if56-bARW3p4';   // clé anon, jamais la service_role
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const PRICE_TTL = 21;

/* cache local */
const C = { me:null, myId:null, email:'', isAdmin:false, users:{}, beers:[], ratings:{}, counts:{},
            reviews:[], logs:[], follows:[], watch:[], wish:[], arts:[] };

/* ============================ AUTHENTIFICATION ============================ */
const Auth = {
  async current() {
    const { data } = await sb.auth.getUser();
    return data.user || null;
  },
  async sendLink(email, handle, ageOk) {
    if (!ageOk) throw new Error("Il faut confirmer que tu as 18 ans ou plus.");
    const { error } = await sb.auth.signInWithOtp({
      email,
      options: { data: { handle, age_ok: true }, emailRedirectTo: window.location.origin }
    });
    if (error) throw error;
  },
  async signOut() { await sb.auth.signOut(); location.reload(); },
  async resetPassword(email) {
    const { error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + window.location.pathname
    });
    if (error) throw error;
  },
  async setPassword(pw) {
    const { error } = await sb.auth.updateUser({ password: pw });
    if (error) throw error;
  }
};

/* ============================ CHARGEMENT ============================ */
async function hydrate() {
  const user = await Auth.current();
  if (!user) return false;
  C.myId = user.id;
  C.email = user.email || '';

  const [profiles, beers, ratings, reviews, replies, reactions, logs, prices, follows, watch, wish] =
    await Promise.all([
      sb.from('profiles').select('*'),
      sb.from('beers').select('*'),
      sb.from('beer_ratings').select('*'),
      sb.from('reviews').select('*').order('cheers_count', { ascending:false }),
      sb.from('replies').select('*').order('created_at'),
      sb.from('reactions').select('*'),                    // RLS : uniquement les miennes
      sb.from('logs').select('*').order('drunk_at', { ascending:false }),
      sb.from('prices').select('*'),
      sb.from('follows').select('*'),
      sb.from('beer_watchers').select('*'),
      sb.from('wishlist').select('beer_id')
    ]);
  C.wish = (wish.data||[]).map(w => w.beer_id);

  /* --- profils --- */
  const followingIds = (follows.data||[]).filter(f => f.follower_id === C.myId).map(f => f.followee_id);
  const followerIds  = (follows.data||[]).filter(f => f.followee_id === C.myId).map(f => f.follower_id);
  C.follows = follows.data || [];

  for (const p of profiles.data || []) {
    const u = {
      h: p.handle, i: initials(p.handle), c: hueOf(p.id), photo: p.avatar_url,
      priv: p.private_stats ? 1 : 0, ville: p.city || '—',
      foll: followingIds.includes(p.id) ? 1 : 0,
      fme:  followerIds.includes(p.id) ? 1 : 0,
      cans: 0, avg: 0, top: '—', week: 0, act: []
    };
    if (p.id === C.myId) { C.me = u; C.users['me'] = u; C.isAdmin = !!p.is_admin; }
    C.users[p.id] = u;
  }

  /* --- stats publiques des autres, en une seule requête ---
     Une fonction par profil faisait autant d'allers-retours que de
     membres. all_public_stats les renvoie d'un coup, en appliquant les
     mêmes filtres côté serveur. */
  const { data: allStats, error: statsErr } = await sb.rpc('all_public_stats');
  if (!statsErr) for (const s of allStats || []) {
    const u = C.users[s.user_id];
    if (!u) continue;
    u.cans = +s.cans||0; u.avg = +s.avg_rating||0;
    u.week = +s.week_cans||0; u.top = s.top_style || '—';
  }

  /* --- bières --- */
  C.beers = (beers.data||[]).map(b => ({
    id: b.id, n: b.name, br: b.brewery, st: b.style || 'Non précisé',
    abv: +b.abv || 0, cl: b.volume_cl, pays: b.country || '—', c: b.color || '#FF7A2F',
    d: b.description || '', img: b.image_url, ok: b.status === 'approved' ? 1 : 0,
    cont: b.container || null,
    kcal: b.kcal_100ml != null ? +b.kcal_100ml : null, kcalSrc: b.kcal_source || null,
    allerg: b.allergens || '', ingr: b.ingredients || '',
    mine: b.submitted_by === C.myId ? 1 : 0,
    track: (watch.data||[]).some(w => w.beer_id === b.id) ? 1 : 0,
    new: Date.now() - new Date(b.created_at) < 30*864e5 ? 1 : 0,
    pr: (prices.data||[]).filter(p => p.beer_id === b.id).map(p => ({
      _id: p.id, s: p.shop, v: p.city || '', p: +p.price,
      by: p.user_id === C.myId ? 'me' : p.user_id,
      age: Math.floor((Date.now() - new Date(p.confirmed_at)) / 864e5)
    }))
  }));

  for (const r of ratings.data||[]) { C.ratings[r.beer_id] = +r.avg_rating; C.counts[r.beer_id] = +r.rating_count; }

  /* --- avis --- */
  C.reviews = (reviews.data||[]).map(r => ({
    id: r.id,
    u: r.user_id === C.myId ? 'me' : r.user_id,     // les vues testent u === 'me'
    b: r.beer_id, r: r.rating, liked: r.liked, t: r.body,
    ch: r.cheers_count,
    bof: r.user_id === C.myId ? r.bofs_count : 0,   // total visible par l'auteur seul
    mych: (reactions.data||[]).some(x => x.review_id===r.id && x.kind==='cheer') ? 1 : 0,
    mybof:(reactions.data||[]).some(x => x.review_id===r.id && x.kind==='bof')   ? 1 : 0,
    pass: (reactions.data||[]).some(x => x.review_id===r.id && x.kind==='pass')  ? 1 : 0,
    rep: (replies.data||[]).filter(x => x.review_id === r.id)
           .map(x => ({ u: x.user_id === C.myId ? 'me' : x.user_id, t: x.body }))
  }));

  /* --- mon journal --- */
  C.logs = (logs.data||[]).map(l => ({
    id: l.id,
    b: l.beer_id, r: l.rating ? +l.rating : 0, liked: l.liked, paid: l.price_paid ? +l.price_paid : 0,
    // counted=false : note saisie de mémoire, sans avoir bu
    counted: l.counted === false ? 0 : 1,
    shop: l.shop || '', d: frDate(l.drunk_at), at: l.drunk_at
  }));

  /* --- activité récente des gens suivis, pour l'onglet copains --- */
  for (const id of followingIds) {
    const { data } = await sb.from('reviews').select('beer_id, rating, created_at')
      .eq('user_id', id).order('created_at',{ascending:false}).limit(3);
    if (C.users[id]) C.users[id].act = (data||[])
      .map(x => ({ b: x.beer_id, r: x.rating, d: frDate(x.created_at) }));
  }

  C.arts = await loadArticles();
  return true;
}

async function loadArticles() {
  const { data } = await sb.from('articles').select('*')
    .eq('status','published')
    .order('published_at',{ ascending:false, nullsFirst:false }).limit(20);
  return (data||[]).map(a => ({
    t:a.title, s:a.summary, c:a.color||'#FF5A1F', url:a.url,
    src:a.source||'', stat:a.stat||'', statLbl:a.stat_label||'', at:a.published_at
  }));
}
/* « 30 juil. 2026 » — les brèves peuvent être antérieures de plusieurs
   mois, donc l'année compte, contrairement au reste de l'app. */
const artDate = d => d
  ? new Date(d).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'})
  : '';

/* ---------- échappement ----------
   Tout le rendu passe par innerHTML. Sans ces trois fonctions, un avis,
   un pseudo ou un nom de bière venant de la base peut injecter du HTML
   et s'exécuter chez ceux qui l'affichent — ce que le RLS n'empêche pas,
   puisque le code tourne avec la session de la victime. */
const ESCAPES = { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ESCAPES[c]);

/* Une couleur atterrit dans un attribut style : on n'accepte qu'un
   code hexadécimal, jamais une valeur libre. */
const safeColor = c => /^#[0-9a-fA-F]{3,8}$/.test(c || '') ? c : '#FF7A2F';

/* Une URL d'image atterrit dans url(...) et parfois dans un onclick :
   on impose http(s) et on retire ce qui permettrait d'en sortir. */
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u.replace(/["'()\\<>\s]/g,'') : '';

/* helpers */
const initials = h => h.replace(/[^a-zA-Z]/g,'').slice(0,2).toUpperCase() || 'BB';
const HUES = ['#FF5A1F','#FFB020','#7FD1D9','#8FD14F','#FF5D8F','#B07A4F','#C9E265','#5FC9E8'];
const hueOf = id => HUES[[...id].reduce((s,c)=>s+c.charCodeAt(0),0) % HUES.length];
const frDate = d => new Date(d).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});

/* ============================ STORE ============================ */
const Store = {

  /* Un seul avis par personne et par bière (contrainte unique en base).

  async addReview(o) {
    const { data, error } = await sb.from('reviews').upsert({

      ch: old?old.ch:0, bof: old?old.bof:0, mych: old?old.mych:0,

  logs: () => C.logs,
  /* la ligne de journal qui porte la note pour cette bière, s'il y en a une */
  myRatedLog: id => C.logs.find(l => l.b === id && l.r),
  myReview:   id => C.reviews.find(r => r.u === 'me' && r.b === id),

  async addLog(l) {
    const counted = l.counted === 0 ? false : true;
    const { data, error } = await sb.from('logs').insert({
      user_id:C.myId, beer_id:l.b, rating:l.r || null, liked:!!l.liked,
      // une note de mémoire ne s'accompagne ni de prix ni de magasin
      price_paid: counted ? (l.paid || null) : null,
      shop: counted ? (l.shop || null) : null,
      counted
    }).select().single();

  },
  async deleteLog(id) {
    const { error } = await sb.from('logs').delete().eq('id', id).eq('user_id', C.myId);
    if (error) throw error;
    C.logs = C.logs.filter(l => l.id !== id);
  },
  /* Retire la consommation sans toucher à la note : l'entrée bascule en
     « de mémoire ». Elle sort des volumes, unités, calories et dépenses,
     mais la note et l'avis restent sur le profil et dans la moyenne. */
  async uncountLog(id) {
    const { error } = await sb.from('logs')
      .update({ counted:false, price_paid:null, shop:null })
      .eq('id', id).eq('user_id', C.myId);

    const l = C.logs.find(x => x.id === id);
    if (l) { l.counted = 0; l.paid = 0; l.shop = ''; }
  },
  /* modification d'une note existante : on réécrit la ligne au lieu
     d'en créer une seconde, qui pèserait deux fois dans la moyenne */
  async updateLog(id, l) {
    const { error } = await sb.from('logs')
      .update({ rating:l.r || null, liked:!!l.liked })
      .eq('id', id).eq('user_id', C.myId);
    if (error) throw error;
    const row = C.logs.find(x => x.id === id);
    if (row) { row.r = l.r; row.liked = l.liked ? 1 : 0; }
  },
  /* Les notes saisies de mémoire ne comptent nulle part comme des canettes :
     ni dans la semaine, ni dans les volumes, ni dans « déjà bues ». */
  drunk: () => C.logs.filter(l => l.counted),
  week: () => Store.drunk().filter(l => Date.now() - new Date(l.at) < 7*864e5).length,
  drunkBeerIds() { const s=[]; Store.drunk().forEach(l => { if(!s.includes(l.b)) s.push(l.b) }); return s; },
  lastPaid(id) { const l = C.logs.find(x => x.b === id); return l ? l.paid : null; },
  arts: () => C.arts,

  units(b) { return +(b.cl * 10 * (b.abv/100) * 0.789 / 10).toFixed(2); },

  /* Calories. Si la fiche n'a rien, on estime : l'alcool pèse 7,1 kcal/g
     et sa densité est 0,789, soit ~5,6 kcal par degré et par 100 ml, plus
     ~14 kcal de glucides résiduels. kcalIsReal dit laquelle des deux on montre. */
  kcal100(b) { return b && b.kcal != null ? b.kcal : +(((b?.abv || 0) * 5.6 + 14).toFixed(1)); },
  kcal(b)    { return b ? Math.round(Store.kcal100(b) * (b.cl || 33) / 10) : 0; },
  kcalIsReal(b) { return !!(b && b.kcal != null && b.kcalSrc === 'off'); },

  stats() {
    // volumes, unités, calories et dépenses : uniquement ce qui a été bu.
    // la note moyenne, elle, tient compte des notes de mémoire.
    const L = Store.drunk(), n = L.length, rated = C.logs.filter(l => l.r);
    const cl  = L.reduce((s,l) => s + (Store.beer(l.b)?.cl || 0), 0);
    const eur = L.reduce((s,l) => s + (l.paid || 0), 0);
    const un  = L.reduce((s,l) => { const b = Store.beer(l.b); return s + (b ? Store.units(b) : 0) }, 0);
    const kcal = L.reduce((s,l) => { const b = Store.beer(l.b); return s + Store.kcal(b) }, 0);
    const weeks = Math.max(1, Math.ceil((Date.now() - new Date(L[L.length-1]?.at || Date.now())) / (7*864e5)));
    return { n, cl, eur, un:+un.toFixed(1), kcal, kcalAvg: Math.round(kcal/weeks),
      avg: rated.length ? rated.reduce((s,l)=>s+l.r,0)/rated.length : 0,
      brews: new Set(L.map(l => Store.beer(l.b)?.br)).size,
      wkAvg: +(n/weeks).toFixed(1), eurAvg: +(eur/weeks).toFixed(2), unAvg: +(un/weeks).toFixed(1) };

  wished:   id => C.wish.includes(id),

  /* ---- mes propositions ---- */

  /* ---- signalements ---- */
  async report(type, id, reason) {

    });

  /* ---- modération (administrateurs) ---- */
  isAdmin: () => !!C.isAdmin,

    try {

    } catch (e) { console.warn('nettoyage des photos', e); }

    const { error } = await sb.rpc('delete_my_account');
    if (error) throw error;
    await sb.auth.signOut();
  },

  weekUnits() {
    return +Store.drunk().filter(l => Date.now() - new Date(l.at) < 7*864e5)
      .reduce((s,l) => { const b = Store.beer(l.b); return s + (b ? Store.units(b) : 0) }, 0).toFixed(1);
  }
};

async function react(id, kind) {
  const r = Store.review(id);
  const key = kind === 'cheer' ? 'mych' : kind === 'bof' ? 'mybof' : 'pass';
  const on = !r[key];
  if (on) {
    const { error } = await sb.from('reactions').insert({ user_id:C.myId, review_id:id, kind });
    if (error) throw error;
    if (kind === 'cheer' && r.mybof) { await drop(id,'bof'); r.mybof = 0; }
    if (kind === 'bof' && r.mych)    { await drop(id,'cheer'); r.mych = 0; }
  } else {
    await drop(id, kind);
  }
  r[key] = on ? 1 : 0;
  return r;
}
async function drop(id, kind) {
  const { error } = await sb.from('reactions').delete()
    .eq('user_id',C.myId).eq('review_id',id).eq('kind',kind);
  if (error) throw error;
}

  const e = document.getElementById('lg-e').value.trim();
  const p = document.getElementById('lg-p').value;
  if(!/.+@.+\..+/.test(e)) return toast('Adresse e-mail invalide');
  if(p.length < 8) return toast('Mot de passe : 8 caractères minimum');

  if(LGMODE === 'up'){
    const p2 = document.getElementById('lg-p2').value;
    if(p !== p2) return toast('Les deux mots de passe ne correspondent pas');
    const h = document.getElementById('lg-h').value.trim().toLowerCase().replace(/\s+/g,'_');
    if(!/^[a-z0-9_.]{3,20}$/.test(h)) return toast('Pseudo : 3 à 20 caractères, sans espace');
    if(!document.getElementById('lg-a').classList.contains('on'))
      return toast('Il faut confirmer que tu as 18 ans ou plus');
    const { error } = await sb.auth.signUp({
      email:e, password:p, options:{ data:{ handle:h, age_ok:true } }
    });
    if(error) return toast(error.message.includes('already') ? 'Cette adresse a déjà un compte' : error.message);
  } else {
    const { error } = await sb.auth.signInWithPassword({ email:e, password:p });
    if(error) return toast('E-mail ou mot de passe incorrect');
  }
  location.reload();
}

const subs = () => C.arts.length ? ['bieres','avis','journal'] : ['bieres','avis'];
const $=s=>document.querySelector(s);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');
  clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),2000)}

/* étoiles avec demi-crans : chaque étoile est une étoile creuse
   recouverte d'une étoile pleine dont on ne montre qu'un pourcentage */
function stars(n,cls){let s='';
  for(let i=1;i<=5;i++){const f=Math.max(0,Math.min(1,(n||0)-i+1));
    s+='<span class="st">★<span class="stf" style="width:'+(f*100)+'%">★</span></span>'}
  return '<span class="stars '+(cls||'')+'">'+s+'</span>'}
const fmtRate = r => String(r).replace('.',',');
function shortName(n){ return n.length > 42 ? n.slice(0,40).trim()+'…' : n }
/* x = afficher le degré · mini = vignette de liste.
   En dessous de ~40 px, le bandeau nom + brasserie devient illisible et
   recouvre la photo : on ne garde que l'image. */
function can(b,x,mini){
  if(!b) return '<div class="can'+(mini?' mini':'')+'"><div class="rim"><span class="pull"></span></div></div>';
  const img = safeUrl(b.img);
  if(mini) return '<div class="can mini'+(img?' hasph':'')+'">'
    + (img ? '<div class="ph"><div class="ph-bg" style="background-image:url('+img+')"></div>'
             +'<div class="ph-fg" style="background-image:url('+img+')"></div></div>'
           : '<div class="rim"><span class="pull"></span></div>')
    + '</div>';
  // Deux couches : la photo entière au premier plan, et la même en fond
  // flouté pour remplir la case. Les photos d'Open Food Facts ont des
  // cadrages très variables — sans ça, l'une montre la canette entière
  // et la voisine un gros plan sur trois lettres.
  return '<div class="can'+(img?' hasph':'')+'">'
   + (img ? '<div class="ph"><div class="ph-bg" style="background-image:url('+img+')"></div>'
            +'<div class="ph-fg" style="background-image:url('+img+')"></div></div>'
          : '<div class="rim"><span class="pull"></span></div>')
   + (b.ok ? '' : '<span class="pend">en attente</span>')
   + '<div class="body"><div class="band" style="background:'+safeColor(b.c)+'"><div class="brow">'
   + '<span class="btxt"><span class="bname">'+esc(shortName(b.n))+'</span>'
   + '<span class="bstyle">'+esc(b.br)+'</span></span>'
   + (x ? '<span class="abv">'+(b.abv ? fmtRate(b.abv)+'°' : 'sans alc.')+'</span>' : '')
   + '</div></div></div></div>';
}
function cell(b,r){return '<button class="cell" onclick="openBeer(\''+esc(b.id)+'\')">'+can(b,1)
  +'<span class="meta">'+stars(r!==undefined?r:Store.rating(b.id),r===undefined?'dim':'')+'</span></button>'}
function av(k,sz){const u=Store.user(k)||Store.me();
  const ph=safeUrl(u.photo);
  const st=ph?'background-image:url('+ph+')':'background:'+safeColor(u.c);
  return '<button class="av" style="'+st+(sz?';width:'+sz+'px;height:'+sz+'px':'')
    +'" onclick="event.stopPropagation();openUser(\''+esc(k)+'\')">'+(ph?'':esc(u.i))+'</button>'}

/* Le bandeau étant hors flux, c'est à la zone de contenu de lui réserver
   sa place. Sa hauteur change selon l'écran — avec ou sans onglets — donc
   on la relit après chaque rendu plutôt que de la coder en dur. */
/* Reprend la bicolorie du mot-symbole : le dernier mot passe en orange.
   Sur un titre d'un seul mot, il n'y a aucune couture naturelle — un
   point orange tient le rôle plutôt qu'une coupure inventée. */
function titreEcran(t){
  const mots = String(t||'').trim().split(/\s+/);
  if (mots.length >= 2) {
    const dernier = mots.pop();
    return esc(mots.join(' ')) + ' <i>' + esc(dernier) + '</i>';
  }
  return esc(t) + '<i class="pt">.</i>';
}

function ajusterChrome(){
  const c=document.getElementById('chrome'), v=document.getElementById('view');
  if(c && v) v.style.paddingTop = c.offsetHeight + 'px';
}
function setSub(k){if(k===S.sub)return;
  const L=subs();S.dir=L.indexOf(k)>L.indexOf(S.sub)?1:-1;S.sub=k;$('#view').scrollTop=0;render(1)}

function openUser(k){
  closeSheet();

}

/* Chaque action écrit en base : si ça échoue, il faut le dire plutôt que
   laisser l'écran afficher un état que la base ne connaît pas. */
async function act(fn, msg){
  try { return await fn() }
  catch(e){ console.error(e); toast(msg || 'Action impossible — réessaie'); return null }
}
async function doCheer(id){ const r = await act(()=>Store.cheer(id)); if(!r)return; repaint(id); if(r.mych) toast('Tu as trinqué à cet avis') }
async function doBof(id){ const r = await act(()=>Store.bof(id)); if(!r)return; repaint(id); toast(r.mybof?'Noté, tu en verras moins comme ça':'Bof retiré') }
async function doPass(id){ const r = await act(()=>Store.pass(id)); if(!r)return; repaint(id); toast(r.pass?'Avis passé à tes abonnés':'Retiré de ton profil') }
/* ---------- répondre à un avis ----------
   Remplace le prompt() du navigateur, qui affichait le nom de domaine
   dans une boîte grise sans rapport avec le reste de l'app. */
const MAX_REPONSE = 500;   // la base refuse au-delà
let REP = { rev:null, txt:'', retour:null };

function doReply(id){
  // on peut répondre depuis une vue, ou depuis la fiche bière déjà ouverte :
  // dans ce second cas il faut savoir où revenir en refermant
  const surFicheBiere = $('#sheet').classList.contains('open')
                        && !!document.querySelector('#sheet .beer-hero');
  REP = { rev:id, txt:'', retour: surFicheBiere ? 'biere' : null };
  drawReply();
}

function drawReply(){
  const r = Store.review(REP.rev);
  if(!r){ fermerReponse(); return }
  const b = Store.beer(r.b);
  const sh = $('#sheet'); sh.classList.add('open');
  sh.innerHTML='<div class="sheet-in"><div class="grab"></div>'
   +'<div class="sheet-bar"><b>Répondre</b>'
     +'<button class="icon-btn" onclick="fermerReponse()">'+I.x+'</button></div>'
   +'<div class="sheet-body">'
   // l'avis auquel on répond, en contexte
   +'<div class="rep-src">'+av(r.u)
     +'<div class="rep-srct"><b>'+esc((Store.user(r.u)||Store.me()).h)+'</b>'
       +(b?'<span>'+esc(b.n)+'</span>':'')
       +'<div class="rep-srcq">'+esc(r.t)+'</div></div></div>'
   +(r.rep.length
     ? '<div class="sec" style="padding-top:18px"><h2>Réponses</h2>'
       +'<span class="eyebrow">'+r.rep.length+'</span></div>'
       +'<div class="replies" style="padding-left:20px">'+r.rep.map(x=>'<div class="reply"><b>'
         +esc((Store.user(x.u)||Store.me()).h)+'</b> '+esc(x.t)+'</div>').join('')+'</div>'
     : '')
   +'<div class="field" style="margin-top:20px"><label>Ta réponse</label>'
     +'<textarea id="rep-t" rows="4" maxlength="'+MAX_REPONSE+'" placeholder="Reste sympa, vous vous connaissez…"'
     +' oninput="REP.txt=this.value;majCompteurReponse()">'+esc(REP.txt)+'</textarea></div>'
   +'<div class="rep-compte" id="rep-c">'+REP.txt.length+' / '+MAX_REPONSE+'</div>'
   +'<button class="cta" id="rep-go" onclick="envoyerReponse()">Envoyer</button>'
   +'</div></div>';
  const z = document.getElementById('rep-t');
  if(z){ z.focus(); z.setSelectionRange(z.value.length, z.value.length) }
  majCompteurReponse();
}

function majCompteurReponse(){
  const c = document.getElementById('rep-c'), go = document.getElementById('rep-go');
  if(c) c.textContent = REP.txt.length + ' / ' + MAX_REPONSE;
  if(go) go.disabled = !REP.txt.trim();
}

function fermerReponse(){
  const id = REP.rev, retour = REP.retour;
  REP = { rev:null, txt:'', retour:null };
  if(retour === 'biere') drawSheet(); else closeSheet();
  if(id) repaint(id);
}

async function envoyerReponse(){
  const t = REP.txt.trim();
  if(!t) return toast('Écris quelque chose d\'abord');
  const go = document.getElementById('rep-go');
  if(go){ go.disabled = true; go.textContent = 'Envoi…' }
  const ok = await act(()=>Store.addReply(REP.rev, t), 'Réponse non envoyée — réessaie');
  if(ok === null){ if(go){ go.disabled=false; go.textContent='Envoyer' } return }
  toast('Réponse publiée');
  fermerReponse();
}

function pickPhoto(){
  const inp=$('#pf');
  inp.onchange = async e => {
    const f = e.target.files[0]; if(!f) return;
    if(!/^image\//.test(f.type)) return toast('Choisis une image');
    if(f.size > 12*1024*1024) return toast('Image trop lourde');
    toast('Envoi en cours…');
    try{
      await Store.setPhoto(await shrink(f, 512));
      render(); toast('Photo mise à jour');
    }catch(err){ console.error(err); toast('Envoi impossible') }
  };
  inp.click();
}

function shrink(file, max){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      const s=Math.min(max/img.width, max/img.height, 1);
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b?res(b):rej(new Error('conversion')), 'image/jpeg', .85);
    };
    img.onerror=()=>rej(new Error('illisible'));
    img.src=url;
  });
}

/* ---------- RGPD : exporter et supprimer ---------- */
function download(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

/* Une cellule qui commence par = + - @ est exécutée comme une formule
   quand le CSV s'ouvre dans Excel. Un nom de bière trafiqué pourrait
   donc lancer du code sur la machine de celui qui ouvre le fichier :
   on désamorce en préfixant d'une apostrophe. */
function csvCell(v){
  let s = v == null ? '' : String(v);
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  if (/[";\n\r]/.test(s))     s = '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function exportData(){
  const L = Store.logs();
  if (!L.length) { toast('Ton journal est encore vide'); return }
  const head = ['Date','Bière','Brasserie','Style','Degré','Volume (cl)','Note sur 5','Bue',
                'Coup de cœur','Prix payé (€)','Magasin','Unités d\'alcool','Calories (kcal)','Mon avis'];
  const rows = L.map(l => {
    const b = Store.beer(l.b) || {};
    const rev = (C.reviews || []).find(r => r.u === 'me' && r.b === l.b);
    return [
      new Date(l.at).toLocaleDateString('fr-FR'),
      b.n || '', b.br || '', b.st || '', b.abv ? fmtRate(b.abv) : '', b.cl || '',
      l.r ? fmtRate(l.r) : '',
      l.counted ? 'oui' : 'non — note de mémoire',
      l.liked ? 'oui' : 'non',
      l.paid ? l.paid.toFixed(2).replace('.', ',') : '',
      l.shop || '',
      (l.counted && b.cl && b.abv) ? String(Store.units(b)).replace('.', ',') : '',
      (l.counted && b.cl) ? Store.kcal(b) : '',
      rev ? rev.t : ''
    ];
  });
  // point-virgule et BOM : sans eux, Excel en français colle tout dans une
  // seule colonne et massacre les accents
  const csv = [head, ...rows].map(r => r.map(csvCell).join(';')).join('\r\n');
  download(new Blob(['﻿' + csv], { type:'text/csv;charset=utf-8' }),
           'letterbeer-journal-' + new Date().toISOString().slice(0,10) + '.csv');
  toast(L.length + ' entrée' + (L.length>1?'s':'') + ' exportée' + (L.length>1?'s':''));
}

/* ---------- fermer une feuille en la tirant vers le bas ----------
   Le geste ne démarre que si le contenu est déjà en haut : sinon on
   volerait le défilement à l'utilisateur qui remonte simplement sa liste.
   La poignée et la barre de titre, elles, répondent toujours. */
(function glisserPourFermer(){
  const SEUIL = 92;      // px au-delà desquels on referme
  const VITESSE = 0.55;  // px/ms : un geste vif ferme sans atteindre le seuil
  let feuille=null, depart=0, dernier=0, tDepart=0, actif=false;

  const cible = e => e.target.closest('.sheet-in');
  const surPoignee = e => !!e.target.closest('.grab, .sheet-bar');

  document.addEventListener('touchstart', e => {
    const f = cible(e); if(!f || e.touches.length !== 1) return;
    const corps = f.querySelector('.sheet-body');
    // un champ ou un bouton garde la main sur son propre geste
    if (e.target.closest('input, textarea, select')) return;
    if (!surPoignee(e) && corps && corps.scrollTop > 0) return;
    feuille=f; depart=dernier=e.touches[0].clientY; tDepart=Date.now(); actif=false;
  }, {passive:true});

  document.addEventListener('touchmove', e => {
    if(!feuille) return;
    const y = e.touches[0].clientY, dy = y - depart;
    dernier = y;
    if (dy <= 0) {                       // vers le haut : on rend la main
      if (actif) { feuille.style.transform=''; feuille.classList.remove('drag'); actif=false }
      return;
    }
    if (!actif) {
      if (dy < 6) return;                // on laisse passer les micro-mouvements
      actif = true; feuille.classList.add('drag');
    }
    // résistance progressive : la feuille suit sans jamais partir trop loin
    feuille.style.transform = 'translateY(' + (dy < 260 ? dy : 260 + (dy-260)*0.25) + 'px)';
  }, {passive:true});

  function relacher(){
    if(!feuille) return;
    const f=feuille; feuille=null;
    if(!actif){ return }
    const dy = dernier - depart;
    const vitesse = dy / Math.max(1, Date.now() - tDepart);
    f.classList.remove('drag');
    if (dy > SEUIL || vitesse > VITESSE) {
      f.classList.add('snap');
      f.style.transform = 'translateY(100%)';
      setTimeout(closeSheet, 220);
    } else {
      f.classList.add('snap');
      f.style.transform = '';
      setTimeout(()=>f.classList.remove('snap'), 280);
    }
    actif=false;
  }
  document.addEventListener('touchend', relacher, {passive:true});
  document.addEventListener('touchcancel', relacher, {passive:true});
})();
function zoomPhoto(url){
  const src=safeUrl(url); if(!src) return;
  const d=document.createElement('div');
  d.className='lightbox';
  d.innerHTML='<img src="'+esc(src)+'" alt="Photo de la canette"><button class="lb-x" aria-label="Fermer">'+I.x+'</button>';
  const close=()=>{d.classList.remove('in');setTimeout(()=>d.remove(),220)};
  d.onclick=close;
  document.addEventListener('keydown',function esc(e){
    if(e.key==='Escape'){close();document.removeEventListener('keydown',esc)}});
  $('#phone').appendChild(d);
  requestAnimationFrame(()=>d.classList.add('in'));
}
async function saveLog(){
  const b = Store.beer(SH.beer), paid = parseFloat((SH.paid||'').replace(',','.')) || null;
  if(!SH.rate && !paid){ toast('Mets au moins une note pour enregistrer'); return }
  const bp = Store.bestPrice(b);
  const compte = SH.already ? 1 : SH.counted;
  try {
    if (SH.already && SH.logId) {
      // la note existe déjà : on la corrige, on n'en crée pas une seconde
      await Store.updateLog(SH.logId, { r:SH.rate, liked:SH.liked });
    } else {
      await Store.addLog({ b:b.id, r:SH.rate, d:"aujourd'hui", liked:SH.liked, counted:compte,
                           paid: compte ? (paid || (bp?bp.p:0)) : 0, shop: compte ? (SH.shop||null) : null });
    }
    if(compte && SH.shop && paid) await Store.addPrice(b.id, SH.shop, paid);
    if(SH.txt.trim()) await Store.addReview({ b:b.id, r:SH.rate, liked:SH.liked, t:SH.txt.trim() });
  } catch(e){
    console.error(e);
    toast('Enregistrement impossible — réessaie');
    return;
  }
  const verbe = SH.already ? ' mise à jour'
              : compte ? ' enregistrée'
              : ' notée · pas comptée comme bue';
  closeSheet();
  toast(b.n + (SH.rate?' · '+fmtRate(SH.rate)+'★':'') + verbe);
  render(); bump();
}

/* +1 : une canette de plus au journal. Elle compte dans le volume, les
   unités, les calories et les dépenses, mais pas dans la moyenne publique.
   Si la note ou l'avis ont été modifiés avant le clic, on enregistre aussi
   la correction — sinon le geste ferait perdre ce qui vient d'être saisi. */
async function addOne(){
  const b = Store.beer(SH.beer);
  const bp = Store.bestPrice(b);
  const paid = parseFloat((SH.paid||'').replace(',','.')) || null;
  const noteModifiee = SH.rate !== SH.rate0 || SH.liked !== SH.liked0;
  const avisModifie  = SH.txt.trim() !== SH.txt0.trim();
  try {
    await Store.addLog({ b:b.id, r:0, d:"aujourd'hui", liked:0,
                         paid: paid || (bp?bp.p:0), shop: SH.shop || null });
    if (noteModifiee && SH.logId) await Store.updateLog(SH.logId, { r:SH.rate, liked:SH.liked });
    if (SH.shop && paid) await Store.addPrice(b.id, SH.shop, paid);
    if (avisModifie && SH.txt.trim())
      await Store.addReview({ b:b.id, r:SH.rate, liked:SH.liked, t:SH.txt.trim() });
  } catch(e){
    console.error(e);
    toast('Impossible d\'ajouter — réessaie');
    return;
  }
  closeSheet();
  toast('+1 ' + b.n + (noteModifiee ? ' · note mise à jour' : ''));
  render(); bump();
}
function bump(){const el=document.getElementById('bign');if(el){el.classList.add('bump');

async function sendBeer(){

/* Écran de repli quand la base ne répond pas. Sur l'offre gratuite, un
   projet sans requête pendant sept jours se met en pause : c'est un cas
   attendu, pas une hypothèse. Mieux vaut l'expliquer qu'une page noire. */
function drawError(){
  document.querySelector('#tabs').style.display='none';
  document.querySelector('#bottombar').style.display='none';
  document.querySelector('#topbar').innerHTML =
    '<span style="width:33px"></span>'+logoLockup(21)+'<span style="width:33px"></span>';
  document.querySelector('#view').innerHTML =
    '<div class="login-mark">'+logoMark(58)+'</div>'
   +'<div class="empty" style="padding:16px 30px 6px">'
     +'<b style="color:var(--text);display:block;margin-bottom:8px">Connexion impossible</b>'
     +'La base n\'a pas répondu. Vérifie ta connexion et réessaie ; '
     +'si ça persiste, préviens-moi, le projet s\'est peut-être mis en veille.</div>'
   +'<button class="cta" onclick="location.reload()">Réessayer</button>';
  requestAnimationFrame(ajusterChrome);
}

/* Le lien de réinitialisation revient avec type=recovery dans le fragment
   d'URL. Il faut l'intercepter avant l'hydratation : la session existe,
   donc sans ça l'app démarrerait normalement et le mot de passe ne serait
   jamais changé. */
const isRecovery = () => /[#&]type=recovery/.test(window.location.hash || '');

/* ---------- invitation d'un ami ----------
   Un lien ?inv=<identifiant du parrain>. On le retient le temps de
   l'inscription — qui recharge la page — puis on crée l'abonnement.

   L'invité suit son parrain, pas l'inverse : les règles de la base ne
   laissent créer un abonnement qu'en son propre nom, et c'est très bien
   ainsi — personne ne doit pouvoir décider qui suit qui. Le parrain
   reçoit donc un abonné, et suit en retour s'il le souhaite. */
const CLE_INVIT = 'lb_invitation';
const estUUID = v => /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(v||'');

function capterInvitation(){
  const p = new URLSearchParams(window.location.search).get('inv');
  if (estUUID(p)) {
    try { localStorage.setItem(CLE_INVIT, p) } catch(e){}
    // on nettoie l'adresse : l'identifiant n'a rien à faire dans l'historique.
    // Certains contextes refusent replaceState — ce n'est pas une raison
    // de perdre l'invitation, qui est déjà en mémoire à ce stade.
    try { history.replaceState(null, '', window.location.pathname) } catch(e){}
  }
}

async function honorerInvitation(){
  let parrain;
  try { parrain = localStorage.getItem(CLE_INVIT) } catch(e){ return }
  if (!parrain) return;
  try { localStorage.removeItem(CLE_INVIT) } catch(e){}
  if (!estUUID(parrain) || parrain === C.myId) return;
  if (C.follows.some(f => f.follower_id===C.myId && f.followee_id===parrain)) return;
  const { error } = await sb.from('follows')
    .insert({ follower_id:C.myId, followee_id:parrain });
  if (error) { console.warn('invitation non honorée', error.message); return }
  const u = C.users[parrain];
  if (u) { u.foll = 1; C.follows.push({ follower_id:C.myId, followee_id:parrain }) }
  toast(u ? 'Tu suis maintenant ' + u.h : 'Invitation acceptée');
}

/* Le lien à faire circuler. On passe par le partage natif quand il existe
   — c'est ce qui ouvre WhatsApp ou les messages — sinon on copie. */
async function inviterUnAmi(){
  const lien = window.location.origin + window.location.pathname + '?inv=' + C.myId;
  const texte = 'Je note mes bières sur Letterbeer, rejoins-moi : ';
  try {
    if (navigator.share) { await navigator.share({ title:'Letterbeer', text:texte, url:lien }); return }
    await navigator.clipboard.writeText(lien);
    toast('Lien copié, envoie-le à qui tu veux');
  } catch(e){
    if (e && e.name === 'AbortError') return;   // partage annulé, rien à signaler
    prompt('Copie ce lien et envoie-le :', lien);
  }
}

/* Service worker : la coque et les photos survivent à une perte de réseau.
   Il ne s'enregistre qu'en HTTPS — en ouvrant le fichier en local, il est
   simplement absent, ce qui n'empêche rien. */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .catch(err => console.warn('service worker non enregistré', err));
  });
}

/* Une app installée peut tourner sans réseau : on le dit au lieu de laisser
   les actions échouer une par une. */
function majReseau(){
  const el = document.getElementById('offline');
  if (el) el.classList.toggle('show', !navigator.onLine);
}
window.addEventListener('online',  () => { majReseau(); toast('Connexion rétablie') });
window.addEventListener('offline', majReseau);

(async () => {
  try {
    capterInvitation();
    if (isRecovery()) { drawReset(); return; }
    const ok = await hydrate();
    if (!ok) { drawLogin(); return; }
    render();
    honorerInvitation().then(() => { if (S.tab==='friends') render() });
  } catch (e) {
    console.error(e);
    drawError();
  }
})();
